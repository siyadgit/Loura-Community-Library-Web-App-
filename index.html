<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenLibrary | Monolith Edition</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #09090b;
  --panel: #121215;
  --panel-border: #27272a;
  --text-main: #f4f4f5;
  --text-muted: #a1a1aa;
  --accent: #ffffff;
  --accent-invert: #000000;
  --input-bg: #18181b;
  --focus-ring: #52525b;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }

body {
  background-color: var(--bg);
  color: var(--text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Header */
header {
  border-bottom: 1px solid var(--panel-border);
  padding: 20px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(10px);
}
.logo {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.05em;
  text-transform: uppercase;
}
.logo span { color: var(--text-muted); font-weight: 300; }
.badge {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid var(--panel-border);
  padding: 4px 10px;
  border-radius: 99px;
  color: var(--text-muted);
}

/* Hero Section */
.hero {
  padding: 80px 20px 60px;
  text-align: center;
  max-width: 800px;
  margin: 0 auto;
}
.hero h1 {
  font-size: clamp(40px, 6vw, 64px);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1.05;
  margin-bottom: 16px;
  text-transform: uppercase;
}
.hero p {
  color: var(--text-muted);
  font-size: 18px;
  margin-bottom: 32px;
  font-weight: 400;
}
.search-wrapper {
  position: relative;
  max-width: 500px;
  margin: 0 auto;
}
.search {
  width: 100%;
  padding: 16px 20px;
  background: var(--input-bg);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  color: var(--text-main);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s ease;
}
.search:focus {
  border-color: var(--accent);
}
.search::placeholder { color: var(--text-muted); }

/* Main Container */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--panel-border);
}
.section-title h2 {
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
}
.section-title span {
  font-size: 13px;
  color: var(--text-muted);
}

/* Form Styling */
.upload-box {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  padding: 32px;
  border-radius: 16px;
  margin-bottom: 60px;
}
label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-top: 16px;
}
input, select, textarea {
  width: 100%;
  padding: 12px 16px;
  background: var(--input-bg);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  color: var(--text-main);
  font-size: 14px;
  margin-top: 6px;
  outline: none;
  transition: all 0.2s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
}
input[type="file"] {
  cursor: pointer;
  color: var(--text-muted);
}
input[type="file"]::file-selector-button {
  background: var(--accent);
  color: var(--accent-invert);
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 12px;
  margin-right: 12px;
  cursor: pointer;
}

button.primary {
  width: 100%;
  margin-top: 24px;
  background: var(--accent);
  color: var(--accent-invert);
  border: 0;
  border-radius: 8px;
  padding: 14px;
  font-weight: 700;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: opacity 0.2s ease;
}
button.primary:hover { opacity: 0.85; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Book Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 24px;
}
.book {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color 0.2s ease, transform 0.2s ease;
}
.book:hover {
  border-color: var(--focus-ring);
  transform: translateY(-2px);
}
.cover {
  height: 140px;
  background: #000;
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 24px;
  letter-spacing: 0.2em;
  color: var(--panel-border);
}
.book-info {
  padding: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.book-info h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
  line-height: 1.3;
}
.book-info .author {
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 12px;
}
.book-info .tag {
  display: inline-block;
  align-self: flex-start;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border: 1px solid var(--panel-border);
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 14px;
  color: var(--text-muted);
}
.book-info .desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
  flex: 1;
  margin-bottom: 20px;
}
.book-actions button {
  width: 100%;
  padding: 10px;
  background: transparent;
  color: var(--text-main);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.book-actions button:hover {
  background: var(--accent);
  color: var(--accent-invert);
  border-color: var(--accent);
}

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  grid-column: 1 / -1;
  font-size: 14px;
  border: 1px dashed var(--panel-border);
  border-radius: 12px;
}
.status {
  font-size: 12px;
  margin-top: 12px;
  color: var(--text-muted);
}

footer {
  border-top: 1px solid var(--panel-border);
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 13px;
}
</style>
</head>
<body>

<header>
  <div class="logo">Open<span>Lib</span></div>
  <div class="badge">Public Domain</div>
</header>

<section class="hero">
  <h1>Knowledge.<br>Unfiltered.</h1>
  <p>An open architectural archive for public knowledge distribution.</p>
  <div class="search-wrapper">
    <input class="search" id="search" placeholder="Search title, author, or tag...">
  </div>
</section>

<main class="container">

<section class="upload-box">
  <div class="section-title">
    <h2>[ Upload Record ]</h2>
    <span>Free Repository Upload</span>
  </div>
  <form id="uploadForm">
    <label>Book Title *</label>
    <input id="title" required placeholder="Title of publication">

    <label>Author *</label>
    <input id="author" required placeholder="Author name">

    <label>Category</label>
    <select id="category">
      <option>Education</option>
      <option>Technology</option>
      <option>Science</option>
      <option>Fiction</option>
      <option>History</option>
      <option>Business</option>
      <option>Other</option>
    </select>

    <label>Description</label>
    <textarea id="description" rows="3" placeholder="Brief summary..."></textarea>

    <label>Source File (PDF, EPUB, DOC, TXT) *</label>
    <input type="file" id="bookFile" accept=".pdf,.epub,.doc,.docx,.txt" required>

    <button class="primary" id="uploadBtn" type="submit">Commit to Archive</button>
    <p class="status" id="uploadStatus"></p>
  </form>
</section>

<section>
  <div class="section-title">
    <h2>[ Archive Index ]</h2>
    <span id="bookCount">Loading index...</span>
  </div>
  <div class="grid" id="bookGrid">
    <div class="empty">Loading library contents...</div>
  </div>
</section>
</main>

<footer>
  <p>OPENLIBRARY / KNOWLEDGE IS PUBLIC</p>
</footer>

<script>
// 1. ADD YOUR SUPABASE PROJECT DETAILS
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const configured =
  !SUPABASE_URL.includes("YOUR_") &&
  !SUPABASE_KEY.includes("YOUR_");

const db = configured
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

let books = [];

const grid = document.getElementById("bookGrid");
const count = document.getElementById("bookCount");
const status = document.getElementById("uploadStatus");

// 2. LOAD BOOKS
async function loadBooks(){
  if(!db){
    grid.innerHTML = '<div class="empty">DB_OFFLINE: Connect Supabase to unlock public archive.</div>';
    count.textContent = "[ Offline ]";
    return;
  }

  const {data,error} = await db
    .from("books")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    grid.innerHTML = '<div class="empty">ERROR: Failed to fetch index entries.</div>';
    count.textContent = "[ Error ]";
    return;
  }

  books = data || [];
  displayBooks();
}

// 3. DISPLAY BOOKS
function displayBooks(){
  const term = document.getElementById("search").value.toLowerCase();

  const filtered = books.filter(book =>
    (book.title || "").toLowerCase().includes(term) ||
    (book.author || "").toLowerCase().includes(term) ||
    (book.category || "").toLowerCase().includes(term)
  );

  count.textContent = filtered.length + " Record(s)";

  if(!filtered.length){
    grid.innerHTML = '<div class="empty">No matching records found.</div>';
    return;
  }

  grid.innerHTML = filtered.map(book => `
    <article class="book">
      <div class="cover">FILE</div>
      <div class="book-info">
        <h3>${escapeHTML(book.title)}</h3>
        <div class="author">By ${escapeHTML(book.author)}</div>
        <div class="tag">${escapeHTML(book.category || "Other")}</div>
        <p class="desc">${escapeHTML(book.description || "No description provided.")}</p>
        <div class="book-actions">
          <button onclick="downloadBook('${book.id}')">DOWNLOAD</button>
        </div>
      </div>
    </article>
  `).join("");
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[char]);
}

// 4. UPLOAD BOOKS
document.getElementById("uploadForm").addEventListener("submit",async e=>{
  e.preventDefault();

  if(!db){
    status.textContent = "Error: Database unconfigured.";
    return;
  }

  const file = document.getElementById("bookFile").files[0];

  if(!file) return;

  if(file.size > 25 * 1024 * 1024){
    status.textContent = "Error: Payload exceeds 25 MB max limit.";
    return;
  }

  const allowed = /\.(pdf|epub|doc|docx|txt)$/i;
  if(!allowed.test(file.name)){
    status.textContent = "Error: Unsupported file signature.";
    return;
  }

  const btn = document.getElementById("uploadBtn");
  btn.disabled = true;
  status.textContent = "Processing payload...";

  try{
    const safeName = crypto.randomUUID() + "-" +
      file.name.replace(/[^a-zA-Z0-9._-]/g,"_");

    const {error:storageError} = await db.storage
      .from("books")
      .upload(safeName,file,{upsert:false});

    if(storageError) throw storageError;

    const {error:dbError} = await db.from("books").insert({
      title:document.getElementById("title").value.trim(),
      author:document.getElementById("author").value.trim(),
      category:document.getElementById("category").value,
      description:document.getElementById("description").value.trim(),
      file_path:safeName
    });

    if(dbError){
      await db.storage.from("books").remove([safeName]);
      throw dbError;
    }

    status.textContent = "Success: Entry recorded.";
    e.target.reset();
    await loadBooks();

  }catch(error){
    console.error(error);
    status.textContent = "Transaction failed: " + error.message;
  }finally{
    btn.disabled = false;
  }
});

// 5. DOWNLOAD BOOKS
async function downloadBook(id){
  const book = books.find(b => b.id === id);
  if(!book) return;

  const {data,error} = await db.storage
    .from("books")
    .createSignedUrl(book.file_path,60);

  if(error){
    alert("Download error: " + error.message);
    return;
  }

  const a = document.createElement("a");
  a.href = data.signedUrl;
  a.download = "";
  a.target = "_blank";
  a.rel = "noopener";
  a.click();
}

// 6. SEARCH
document.getElementById("search")
  .addEventListener("input",displayBooks);

// 7. REAL-TIME COMMUNITY UPDATES
if(db){
  loadBooks();

  db.channel("library-updates")
    .on("postgres_changes",{
      event:"*",
      schema:"public",
      table:"books"
    },loadBooks)
    .subscribe();
}else{
  loadBooks();
}
</script>
</body>
</html>
